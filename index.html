<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Manga Reader</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #1f2937;
    padding: 12px;
    text-align: center;
}

h2 { margin: 0 0 10px; }

.version {
    font-size: 12px;
    color: #94a3b8;
    font-weight: normal;
}

button, .file-button {
    display: inline-block;
    background: #2563eb;
    color: white;
    border: 0;
    padding: 12px 16px;
    border-radius: 9px;
    font-size: 15px;
    margin: 3px;
    cursor: pointer;
}

button:disabled { opacity: 0.5; }

#pdfInput { display: none; }

#status {
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 9px;
}

#result {
    display: none;
    background: #1f2937;
    margin: 12px;
    padding: 12px;
    border-radius: 9px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
    font-size: 14px;
}

#pages {
    padding: 10px;
    max-width: 850px;
    margin: auto;
}

.page {
    position: relative;
    width: 100%;
    margin: 0 auto 14px;
    background: white;
    box-shadow: 0 2px 8px #0008;
}

.page canvas {
    display: block;
    width: 100%;
    height: auto;
}

.text-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.ocr-line {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    color: #111;
    background: rgba(255, 255, 255, 0.96);
    line-height: 1.05;
    padding: 1px 2px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
    <h2>📚 AI Manga Reader <span class="version">v3</span></h2>

    <label class="file-button" for="pdfInput">📂 PDF tanlash</label>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf">

    <button id="ocrButton" disabled>🔍 Matnni aniqlash</button>

    <div id="status">PDF faylingizni tanlang</div>
</header>

<div id="result"></div>

<main id="pages"></main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
// ---------- Elementlar ----------
const input = document.getElementById("pdfInput");
const pagesBox = document.getElementById("pages");
const statusEl = document.getElementById("status");
const resultBox = document.getElementById("result");
const ocrButton = document.getElementById("ocrButton");

let currentPage = null;
let worker = null;

function showStatus(text) {
    statusEl.textContent = text;
}

function showResult(text) {
    resultBox.style.display = "block";
    resultBox.textContent = text;
}

function hideResult() {
    resultBox.style.display = "none";
    resultBox.textContent = "";
}

// ---------- Telegram Web App (bo'lmasa ham xato bermaydi) ----------
try {
    if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }
} catch (e) {
    console.warn("Telegram WebApp ishlamadi:", e);
}

// ---------- PDF.js sozlash ----------
if (typeof pdfjsLib !== "undefined") {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
} else {
    showStatus("❌ PDF.js yuklanmadi. Internetni tekshirib, sahifani yangilang.");
}

// ---------- Qaysi sahifa ekranda ekanini aniqlash ----------
const observer = new IntersectionObserver(entries => {
    const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio);

    if (visible.length > 0) {
        currentPage = visible[0].target;
    }
}, { threshold: [0.2, 0.4, 0.6, 0.8] });

// ---------- PDF ochish (asosiy funksiya) ----------
async function openPdf(arrayBuffer) {
    if (typeof pdfjsLib === "undefined") {
        showStatus("❌ PDF.js yuklanmadi. Internetni tekshiring.");
        return;
    }

    pagesBox.innerHTML = "";
    hideResult();
    currentPage = null;
    ocrButton.disabled = true;
    showStatus("⏳ PDF ochilmoqda...");

    try {
        const pdf = await pdfjsLib.getDocument({
            data: new Uint8Array(arrayBuffer)
        }).promise;

        showStatus(pdf.numPages + " ta sahifa topildi.");

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const original = page.getViewport({ scale: 1 });

            const maxWidth = Math.max(280, window.innerWidth - 20);
            const scale = Math.min(maxWidth / original.width, 1.6);
            const viewport = page.getViewport({ scale: scale });
            const ratio = Math.min(window.devicePixelRatio || 1, 2);

            const container = document.createElement("div");
            container.className = "page";
            container.dataset.pageNumber = i;

            const canvas = document.createElement("canvas");
            canvas.width = Math.floor(viewport.width * ratio);
            canvas.height = Math.floor(viewport.height * ratio);
            container.appendChild(canvas);

            const overlay = document.createElement("div");
            overlay.className = "text-overlay";
            container.appendChild(overlay);

            pagesBox.appendChild(container);

            await page.render({
                canvasContext: canvas.getContext("2d"),
                viewport: viewport,
                transform: [ratio, 0, 0, ratio, 0, 0]
            }).promise;

            observer.observe(container);

            if (i === 1) {
                currentPage = container;
                ocrButton.disabled = false;
            }

            showStatus("Sahifa " + i + " / " + pdf.numPages);
        }

        showStatus("✅ PDF tayyor! " + pdf.numPages + " ta sahifa.");
    } catch (error) {
        console.error(error);
        showStatus("❌ PDF ochilmadi: " + error.message);
        showResult("PDF xatosi: " + error.message);
    }
}

// ---------- Fayl tanlanganda ----------
input.addEventListener("change", async function () {
    const file = input.files[0];
    if (!file) return;

    const isPdf =
        file.type === "application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf");

    if (!isPdf) {
        showStatus("❌ Iltimos, PDF fayl tanlang!");
        return;
    }

    showStatus("⏳ Fayl o'qilmoqda...");

    try {
        const buffer = await file.arrayBuffer();
        await openPdf(buffer);
    } catch (error) {
        console.error(error);
        showStatus("❌ Faylni o'qib bo'lmadi: " + error.message);
    }

    input.value = "";
});

// ---------- Manzildan PDF ochish: ?pdf=https://... ----------
(async function loadFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const url = params.get("pdf");
    if (!url) return;

    showStatus("⏳ PDF yuklab olinmoqda...");

    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error("Server javobi: " + response.status);
        }
        await openPdf(await response.arrayBuffer());
    } catch (error) {
        console.error(error);
        showStatus("❌ PDF'ni manzildan yuklab bo'lmadi: " + error.message);
    }
})();

// ---------- OCR natijasidan qatorlarni yig'ish ----------
function collectLines(data) {
    if (data.lines && data.lines.length) return data.lines;

    const lines = [];
    for (const block of data.blocks || []) {
        for (const paragraph of block.paragraphs || []) {
            for (const line of paragraph.lines || []) {
                lines.push(line);
            }
        }
    }
    return lines;
}

// ---------- OCR ----------
ocrButton.addEventListener("click", async function () {
    if (!currentPage) {
        showStatus("❌ Avval sahifani ekranga chiqaring.");
        return;
    }

    if (typeof Tesseract === "undefined") {
        showStatus("❌ OCR kutubxonasi yuklanmadi.");
        return;
    }

    const canvas = currentPage.querySelector("canvas");
    const overlay = currentPage.querySelector(".text-overlay");

    if (!canvas || !overlay) {
        showStatus("❌ Sahifa topilmadi.");
        return;
    }

    ocrButton.disabled = true;
    overlay.innerHTML = "";
    showResult("OCR ishga tushmoqda...");

    try {
        if (!worker) {
            showStatus("OCR tizimi yuklanmoqda...");
            worker = await Tesseract.createWorker("eng");
        }

        showStatus("🔍 Matn aniqlanmoqda...");

        const output = await worker.recognize(canvas);
        const lines = collectLines(output.data);
        const foundText = [];

        for (const line of lines) {
            const text = (line.text || "").trim();
            if (!text) continue;

            foundText.push(text);

            const box = line.bbox;
            const element = document.createElement("div");
            element.className = "ocr-line";
            element.textContent = text;

            const left = box.x0 / canvas.width * 100;
            const top = box.y0 / canvas.height * 100;
            const width = (box.x1 - box.x0) / canvas.width * 100;
            const height = (box.y1 - box.y0) / canvas.height * 100;

            element.style.left = left + "%";
            element.style.top = top + "%";
            element.style.width = width + "%";
            element.style.height = height + "%";

            const displayHeight = canvas.clientHeight * height / 100;
            element.style.fontSize = Math.max(9, displayHeight * 0.75) + "px";

            overlay.appendChild(element);
        }

        if (foundText.length === 0) {
            showResult("Matn topilmadi. Boshqa sahifada sinab ko'ring.");
        } else {
            showResult(
                "ANIQLANGAN MATN:\n\n" +
                foundText.join("\n\n") +
                "\n\nIshonchlilik: " +
                output.data.confidence.toFixed(1) + "%"
            );
        }

        showStatus("✅ OCR tugadi!");
    } catch (error) {
        console.error(error);
        showResult("OCR XATOSI:\n" + error.message);
        showStatus("❌ OCR ishlamadi.");
    }

    ocrButton.disabled = false;
});
</script>

</body>
</html>
