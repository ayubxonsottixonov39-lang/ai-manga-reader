
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Manga Reader</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #1f2937;
    padding: 12px;
    text-align: center;
}

h2 {
    margin: 0 0 12px;
}

button, .file-button {
    display: inline-block;
    background: #2563eb;
    color: white;
    border: 0;
    padding: 12px 16px;
    border-radius: 9px;
    font-size: 15px;
    margin: 3px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

#pdfInput {
    display: none;
}

#status {
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 9px;
}

#result {
    background: #1f2937;
    margin: 12px;
    padding: 12px;
    border-radius: 9px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
    font-size: 14px;
}

#pages {
    padding: 10px;
    max-width: 850px;
    margin: auto;
}

.page {
    position: relative;
    width: 100%;
    margin: 0 auto 14px;
    background: white;
    box-shadow: 0 2px 8px #0008;
}

.page canvas {
    display: block;
    width: 100%;
    height: auto;
}

.text-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.ocr-line {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    color: #111;
    background: rgba(255,255,255,0.96);
    line-height: 1.05;
    padding: 1px 2px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
    <h2>📚 AI Manga Reader</h2>

    <label class="file-button" for="pdfInput">
        📂 PDF tanlash
    </label>

    <input
        type="file"
        id="pdfInput"
        accept=".pdf,application/pdf"
    >

    <button id="ocrButton" disabled>
        🔍 Matnni aniqlash
    </button>

    <div id="status">
        PDF faylingizni tanlang
    </div>
</header>

<div id="result">
    Aniqlangan matn shu yerda chiqadi.
</div>

<main id="pages"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>

const input = document.getElementById("pdfInput");
const pages = document.getElementById("pages");
const status = document.getElementById("status");
const result = document.getElementById("result");
const ocrButton = document.getElementById("ocrButton");

let currentPage = null;
let worker = null;

if (typeof pdfjsLib !== "undefined") {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const observer = new IntersectionObserver(entries => {

    const visible = entries
        .filter(entry => entry.isIntersecting)
        .sort((a, b) =>
            b.intersectionRatio - a.intersectionRatio
        );

    if (visible.length > 0) {
        currentPage = visible[0].target;
    }

}, {
    threshold: [0.2, 0.4, 0.6, 0.8]
});


// PDF OCHISH

input.addEventListener("change", async function() {

    const file = input.files[0];

    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".pdf")) {
        status.textContent = "❌ PDF fayl tanlang!";
        return;
    }

    if (typeof pdfjsLib === "undefined") {
        status.textContent = "❌ PDF.js yuklanmadi. Internetni tekshiring.";
        return;
    }

    pages.innerHTML = "";
    result.textContent = "PDF yuklanmoqda...";
    currentPage = null;
    ocrButton.disabled = true;

    status.textContent = "⏳ PDF ochilmoqda...";

    try {

        const buffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: new Uint8Array(buffer)
        }).promise;

        status.textContent =
            pdf.numPages + " ta sahifa topildi.";

        for (let i = 1; i <= pdf.numPages; i++) {

            const page = await pdf.getPage(i);

            const original = page.getViewport({
                scale: 1
            });

            const maxWidth = Math.max(
                280,
                window.innerWidth - 20
            );

            const scale = Math.min(
                maxWidth / original.width,
                1.6
            );

            const viewport = page.getViewport({
                scale: scale
            });

            const ratio = window.devicePixelRatio || 1;

            const container = document.createElement("div");
            container.className = "page";

            const canvas = document.createElement("canvas");

            canvas.width = Math.floor(
                viewport.width * ratio
            );

            canvas.height = Math.floor(
                viewport.height * ratio
            );

            container.appendChild(canvas);

            const overlay = document.createElement("div");
            overlay.className = "text-overlay";
            container.appendChild(overlay);

            pages.appendChild(container);

            const context = canvas.getContext("2d");

            await page.render({
                canvasContext: context,
                viewport: viewport,
                transform: [
                    ratio, 0, 0, ratio, 0, 0
                ]
            }).promise;

            container.dataset.pageNumber = i;

            observer.observe(container);

            status.textContent =
                "Sahifa " + i + " / " + pdf.numPages;
        }

        currentPage = pages.querySelector(".page");

        ocrButton.disabled = false;

        status.textContent =
            "✅ PDF tayyor! Sahifani tanlang.";

        result.textContent =
            "PDF muvaffaqiyatli ochildi.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ PDF ochilmadi: " + error.message;

        result.textContent =
            "PDF xatosi: " + error.message;
    }

});


// OCR VA MATNNI JOYLASHTIRISH

ocrButton.addEventListener("click", async function() {

    if (!currentPage) {
        status.textContent =
            "❌ Avval sahifani ekranga chiqaring.";
        return;
    }

    if (typeof Tesseract === "undefined") {
        status.textContent =
            "❌ OCR kutubxonasi yuklanmadi.";
        return;
    }

    const canvas = currentPage.querySelector("canvas");
    const overlay = currentPage.querySelector(".text-overlay");

    if (!canvas || !overlay) {
        status.textContent =
            "❌ Sahifa topilmadi.";
        return;
    }

    ocrButton.disabled = true;

    overlay.innerHTML = "";
    result.textContent = "OCR ishga tushmoqda...";

    try {

        if (!worker) {
            status.textContent =
                "OCR tizimi yuklanmoqda...";

            worker = await Tesseract.createWorker("eng");
        }

        status.textContent =
            "🔍 Matn aniqlanmoqda...";

        const output = await worker.recognize(canvas);

        const lines = output.data.lines || [];

        const foundText = [];

        for (const line of lines) {

            const text = line.text.trim();

            if (!text) continue;

            foundText.push(text);

            const box = line.bbox;

            const element = document.createElement("div");

            element.className = "ocr-line";
            element.textContent = text;

            const left = box.x0 / canvas.width * 100;
            const top = box.y0 / canvas.height * 100;
            const width = (box.x1 - box.x0) / canvas.width * 100;
            const height = (box.y1 - box.y0) / canvas.height * 100;

            element.style.left = left + "%";
            element.style.top = top + "%";
            element.style.width = width + "%";
            element.style.height = height + "%";

            const displayHeight =
                canvas.clientHeight * height / 100;

            element.style.fontSize =
                Math.max(9, displayHeight * 0.75) + "px";

            overlay.appendChild(element);
        }

        if (foundText.length === 0) {

            result.textContent =
                "Matn topilmadi. Boshqa sahifada sinab ko‘ring.";

        } else {

            result.textContent =
                "ANIQLANGAN MATN:\n\n" +
                foundText.join("\n\n") +
                "\n\nIshonchlilik: " +
                output.data.confidence.toFixed(1) +
                "%";

        }

        status.textContent =
            "✅ OCR tugadi!";

    } catch (error) {

        console.error(error);

        result.textContent =
            "OCR XATOSI:\n" + error.message;

        status.textContent =
            "❌ OCR ishlamadi.";
    }

    ocrButton.disabled = false;

});

</script>

</body>
</html>
