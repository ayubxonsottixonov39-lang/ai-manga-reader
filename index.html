<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Manga Reader</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1f2937;
    padding: 14px;
    text-align: center;
}

h2 { margin: 0 0 12px; }

button, .file-button {
    display: inline-block;
    background: #2563eb;
    color: white;
    border: 0;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin: 3px;
}

#pdfInput { display: none; }

#status {
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 9px;
}

#pages {
    padding: 10px;
    max-width: 850px;
    margin: auto;
}

.page {
    margin: 0 auto 12px;
    background: white;
    box-shadow: 0 2px 8px #0008;
}

.page canvas {
    display: block;
    width: 100%;
    height: auto;
}

#result {
    background: #1f2937;
    margin: 12px;
    padding: 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
}
</style>
</head>

<body>

<header>
    <h2>📚 AI Manga Reader</h2>

    <label class="file-button" for="pdfInput">
        📂 PDF tanlash
    </label>

    <input type="file" id="pdfInput" accept="application/pdf">

    <button id="ocrButton" disabled>
        🔍 Matnni aniqlash
    </button>

    <div id="status">PDF faylingizni tanlang</div>
</header>

<div id="result">
    Aniqlangan matn shu yerda chiqadi.
</div>

<main id="pages"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const input = document.getElementById("pdfInput");
const pages = document.getElementById("pages");
const status = document.getElementById("status");
const result = document.getElementById("result");
const ocrButton = document.getElementById("ocrButton");

let currentCanvas = null;
let worker = null;

const observer = new IntersectionObserver(entries => {
    const visible = entries
        .filter(entry => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio);

    if (visible.length > 0) {
        currentCanvas = visible[0].target;
    }
}, { threshold: [0.2, 0.5, 0.8] });

input.addEventListener("change", async function() {
    const file = input.files[0];
    if (!file) return;

    if (file.type !== "application/pdf") {
        status.textContent = "Faqat PDF tanlang!";
        return;
    }

    pages.innerHTML = "";
    result.textContent = "Aniqlangan matn shu yerda chiqadi.";
    currentCanvas = null;
    ocrButton.disabled = true;
    status.textContent = "PDF yuklanmoqda...";

    try {
        const data = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: data
        }).promise;

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);

            const container = document.createElement("div");
            container.className = "page";

            const canvas = document.createElement("canvas");
            container.appendChild(canvas);
            pages.appendChild(container);

            const original = page.getViewport({ scale: 1 });

            const scale = Math.min(
                (window.innerWidth - 20) / original.width,
                2
            );

            const viewport = page.getViewport({ scale });
            const ratio = window.devicePixelRatio || 1;

            canvas.width = Math.floor(viewport.width * ratio);
            canvas.height = Math.floor(viewport.height * ratio);

            const context = canvas.getContext("2d");

            await page.render({
                canvasContext: context,
                viewport: viewport,
                transform: [ratio, 0, 0, ratio, 0, 0]
            }).promise;

            observer.observe(canvas);

            status.textContent =
                "Sahifa " + i + " / " + pdf.numPages;
        }

        ocrButton.disabled = false;
        status.textContent = "✅ PDF tayyor! Kerakli sahifaga o'ting.";

    } catch (error) {
        console.error(error);
        status.textContent = "❌ PDF ochilmadi.";
    }
});

ocrButton.addEventListener("click", async function() {
    if (!currentCanvas) {
        status.textContent = "❌ Sahifa tanlanmagan!";
        return;
    }

    ocrButton.disabled = true;
    result.textContent = "OCR tayyorlanmoqda...";
    status.textContent = "🔍 OCR ishga tushmoqda...";

    try {
        if (!worker) {
            worker = await Tesseract.createWorker("eng");
        }

        status.textContent = "🔍 Rasm o‘qilmoqda...";

        const output = await worker.recognize(currentCanvas);

        const text = output.data.text.trim();

        result.textContent =
            "NATIJА:\n" +
            (text || "Matn topilmadi.") +
            "\n\nIshonchlilik: " +
            output.data.confidence +
            "%\nSo‘zlar soni: " +
            output.data.words.length;

        status.textContent = "✅ OCR tugadi!";

    } catch (error) {
        console.error(error);

        result.textContent =
            "XATOLIK:\n" + error.message;

        status.textContent = "❌ OCR xatosi!";
    }

    ocrButton.disabled = false;
});
